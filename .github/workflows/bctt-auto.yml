name: BCTT Auto Process

on:
  schedule:
    - cron: '*/5 * * * *'  # Chạy mỗi 5 phút
  workflow_dispatch:        # Cho phép chạy thủ công

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call BCTT Auto API
        run: |
          curl -f -s "${{ secrets.APP_URL }}/api/cron/bctt-auto?secret=${{ secrets.CRON_SECRET }}" \
            -o /tmp/response.json && cat /tmp/response.json || echo "API call failed"
